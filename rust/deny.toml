# cargo-deny policy for openmosh_core (https://embarkstudios.github.io/cargo-deny/).
# The app is GPL-3.0; every allowed license below is GPL-3.0 compatible.

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
    # `adler` is unmaintained (informational notice, no vulnerability). It is
    # pulled in transitively through flutter_rust_bridge; remove this entry once
    # flutter_rust_bridge drops it.
    { id = "RUSTSEC-2025-0056", reason = "unmaintained notice only; transitive via flutter_rust_bridge" },
    # `chrono` is flagged unmaintained (informational, no vulnerability). It is
    # pulled in transitively through russh-sftp; remove this entry once
    # russh-sftp drops or replaces it.
    { id = "RUSTSEC-2026-0543", reason = "unmaintained notice only; transitive via russh-sftp" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CDLA-Permissive-2.0",
]

# openmosh_core itself is unpublished.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
