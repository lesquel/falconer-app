[package]
name = "openmosh_core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
flutter_rust_bridge = "=2.13.0"
getrandom = "0.3"
russh = { version = "0.65.1", default-features = false, features = ["ring", "flate2"] }
russh-sftp = "3.0.1"
sha2 = "0.11.1"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "fs"] }
zeroize = "1.9.1"

# Smaller, faster native library. cargokit builds Android release with
# `cargo build --release`, so this profile applies. Never `panic = "abort"`:
# flutter_rust_bridge relies on unwinding to turn panics into Dart errors.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[dev-dependencies]
bytes = "1.12.1"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["test-util"] }
