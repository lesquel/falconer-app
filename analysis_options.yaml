include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - lib/shared/bridge/**
    - "**/*.g.dart"
    - rust_builder/**
    - build/**
    - android/**
    - third_party/**
    - ios/**
    - macos/**
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    avoid_print: true
    prefer_const_constructors: true
    prefer_final_locals: true
    unawaited_futures: true

formatter:
  page_width: 100
