name: release

# Builds signed per-ABI release APKs for a `v*` tag and attaches them, with
# SHA256SUMS and its minisign signature (public key RWTiZ1vxHn/jWfqAEjobeqloI9cL9pOA0/in+ayyCgPqT0gYDRKR1Ox5),
# to the GitHub release of that tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        # The Rust core is built for three Android ABIs; the default runner image runs out of disk.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/lib/node_modules
          df -h /
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Test
        run: |
          flutter pub get
          flutter test
      - name: Release keystore
        env:
          KEYSTORE_B64: ${{ secrets.OPENMOSH_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "OPENMOSH_KEYSTORE_B64 is not set: refusing to publish debug-signed APKs" >&2
            exit 1
          fi
          umask 077
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "OPENMOSH_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build APKs
        env:
          OPENMOSH_KEYSTORE_PASSWORD: ${{ secrets.OPENMOSH_KEYSTORE_PASSWORD }}
          OPENMOSH_KEY_ALIAS: ${{ secrets.OPENMOSH_KEY_ALIAS }}
          OPENMOSH_KEY_PASSWORD: ${{ secrets.OPENMOSH_KEY_PASSWORD }}
        run: >
          flutter build apk --release --split-per-abi
          --obfuscate --split-debug-info=build/symbols
      - name: Collect
        run: |
          mkdir dist
          v="${GITHUB_REF_NAME}"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "dist/openmosh-$v-$abi.apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS)
          rm -f "$RUNNER_TEMP/release.jks"
      - name: Sign checksums (minisign, key id 59E37F1EF15B67E2)
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          # rsign2 is minisign-compatible; Ubuntu's minisign cannot read unencrypted keys.
          cargo install rsign2 --version 0.6.7 --locked
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/minisign.key"
          rsign sign -W -s "$RUNNER_TEMP/minisign.key" -t "openmosh-app $GITHUB_REF_NAME" dist/SHA256SUMS < /dev/null
          rm -f "$RUNNER_TEMP/minisign.key"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # v1.2.0-rc.1 and similar test builds are pre-releases, never "latest".
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" $pre --title "OpenMosh $GITHUB_REF_NAME" --notes "Android app. Install the APK for your phone (most phones: arm64-v8a)."
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
